name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: # Allows manual trigger button

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants git push rights
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 
        with:
          fetch-depth: 1

      - name: Get Python 3.11
        uses: actions/setup-python@v6 
        with:
          python-version: '3.11'

      - name: Configure pip cache
        uses: actions/cache@v5 
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --upgrade pip
        run: python -m pip install -r cache/requirements.txt

      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python update_today.py

      - name: Commit and Push
        run: |-
          git add .
          git diff
          git config --global user.email "hardikcodeandprogram@gmail.com"
          git config --global user.name "HardikGupta/GitHub-Actions-Bot"
          git commit -m "Updated README" -a || echo "No changes to commit"
          git pull --rebase -X theirs origin main
          git push
